version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: rwandago-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-rwandago}
      POSTGRES_USER: ${DB_USER:-rwandago_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rwandago_secret}
    ports:
      - "5432:5432"
    volumes:
      - rwandago_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rwandago_user} -d ${DB_NAME:-rwandago}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: rwandago-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rwandago}
      DB_USER: ${DB_USER:-rwandago_user}
      DB_PASSWORD: ${DB_PASSWORD:-rwandago_secret}
      RWANDAGO_JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: rwandago-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  rwandago_pgdata:
