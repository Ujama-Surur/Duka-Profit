# Duka Profit Nginx Production Configuration
# Place this in /etc/nginx/sites-available/duka-profit
# Enable: sudo ln -sf /etc/nginx/sites-available/duka-profit /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx
#
# SSL Certificate Generation (includes both apex and www):
# sudo certbot --nginx -d dukaprofit.com -d www.dukaprofit.com --expand

# 1. Redirect all HTTP traffic to HTTPS (apex domain)
server {
    listen 80;
    listen [::]:80;
    server_name dukaprofit.com www.dukaprofit.com;

    return 301 https://dukaprofit.com$request_uri;
}

# 2. Redirect HTTPS www to HTTPS apex domain (canonical URL)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dukaprofit.com;

    ssl_certificate /etc/letsencrypt/live/dukaprofit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dukaprofit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dukaprofit.com$request_uri;
}

# 3. Main HTTPS Application Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dukaprofit.com;

    # SSL certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dukaprofit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dukaprofit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max upload body size for product images / CSV imports
    client_max_body_size 10M;

    # Proxy all traffic to Node.js / Express backend (which also serves React dist in production)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dedicated Socket.io WebSocket support
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
